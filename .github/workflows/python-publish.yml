# Upload the Python package to PyPI when a GitHub release is published
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

name: Upload Python Package

on:
  release:
    # 'published' also fires when a draft release is published ('created' does not fire for drafts)
    types: [published]
  workflow_dispatch:

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Check that the release is the version of the package
      if: github.event_name == 'release'
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' overlay_arrows_and_more/__init__.py)
        if [ "$VERSION" != "${TAG#v}" ]; then
          echo "::error::The release $TAG is not the version of the package: __version__ = \"$VERSION\" in overlay_arrows_and_more/__init__.py"
          exit 1
        fi
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    - name: Build sdist and wheel (pyproject.toml)
      run: |
        python -m build
        python -m twine check dist/*
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload dist/*
